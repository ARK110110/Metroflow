<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metroflow</title>
    <link rel="stylesheet" href="../src/output.css">
  </head>
  <body>
        <!-- Profile Picture -->
        <div class="h-[294px] flex justify-center">
            <div class="rounded-full bg-[#D9D9D9] w-[150px] h-[150px] justify-center mt-[124px]"> <!-- Profile Picture -->
                <img src="../assets/PP.png" alt="Profile Picture" class="w-full h-full text-center items-center rounded-full">
            </div>
        </div>
        <div class="h-[5px] w-full bg-[#F2F7FB]"></div> 
        <!-- Profile Settings -->
         <div class="justify-center flex">
             <div class="w-[448px] mt-[20px]">
                 <!-- Names & Email -->
                 <div class="text-center justify-center flex flex-col">
                     <h1 class="text-[32px] font-bold">Midoriya Deku</h1>
                     <p class="text-[16px] font-bold text-black/50">midoriyadeku@gmail.com</p>
                </div>
                <!-- General Settings -->
                <div class="flex flex-col">
                    <h1 class="text-[16px] font-bold pl-[15px] pt-[20px] pb-[10px]">General</h1>
                    <!------------------------------------------------------------------------->
                    <div class="pt-[10px] pb-[10px] px-[18px] rounded-[15px] bg-[#595959] flex flex-col">
                        <div class="flex flex-row justify-between">
                            <iconify-icon class="pr-[10px]" icon="tabler:user" width="25" height="25"  style="color: #fff"></iconify-icon>
                            <p class="text-white text-[16px] flex-10">Profile</p>
                            <a href="#Profile">
                                <iconify-icon icon="mingcute:right-line" width="25" height="25"  style="color: #fff"></iconify-icon>
                            </a>
                        </div>
                        <hr class="w-[420px] h-0 my-[18px] flex justify-center border border-[#686868]">
                        <div class="flex flex-row justify-between">
                            <iconify-icon class="pr-[10px]" icon="material-symbols:lock-outline" width="25" height="25"  style="color: #fff"></iconify-icon>
                            <p class="text-white text-[16px] flex-10">Create Password</p>
                            <a href="#Create-password">
                                <iconify-icon icon="mingcute:right-line" width="25" height="25"  style="color: #fff"></iconify-icon>
                            </a>
                        </div>
                    </div>
                    <!------------------------------------------------------------------------->
                </div>
                <!-- Other Settings -->
                <div class="flex flex-col">
                    <h1 class="text-[16px] font-bold pl-[15px] pt-[25px] pb-[10px]">Other</h1>
                    <!------------------------------------------------------------------------->
                    <div class="pt-[10px] pb-[10px] px-[18px] rounded-[15px] bg-[#595959] flex flex-col">
                        <div class="flex flex-row justify-between">
                            <iconify-icon class="pr-[10px]" icon="material-symbols-light:translate" width="25" height="25"  style="color: #fff"></iconify-icon>
                            <p class="text-white text-[16px] flex-10">Change Language</p>
                            <a href="#Change-languange">
                                <iconify-icon icon="mingcute:right-line" width="25" height="25"  style="color: #fff"></iconify-icon>
                            </a>
                        </div>
                        <hr class="w-[420px] h-0 my-[18px] flex justify-center border border-[#686868]">
                        <div class="flex flex-row justify-between">
                            <iconify-icon class="pr-[10px]" icon="proicons:dark-theme" width="25" height="25"  style="color: #fff"></iconify-icon>
                            <p class="text-white text-[16px] flex-10">Theme</p>
                            <a href="#Theme">
                                <iconify-icon icon="mingcute:right-line" width="25" height="25"  style="color: #fff"></iconify-icon>
                            </a>
                        </div>
                    </div>
                    <!------------------------------------------------------------------------->
                    <a href="#logout" class="text-[16px] ml-[15px] mt-[18px] hover:font-bold">Logout</a>
                </div>
            </div>
        </div>
      <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  </body>
</html>
