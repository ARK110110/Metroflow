<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="../src/output.css">
  </head>
  <body>
    <div class="flex flex-row justify-center items-center mt-[107px] gap-[567px]"> <!-- main group -->
        <!-- kiri -->
        <div class="flex flex-col gap-[347px]">
          <img class="w-[267px] h-[401px]" src="../assets/metroflowLogo.svg" alt="">
          <h1 class="text-2xl text-center">PT. Metro Flow</h1>
        </div>
        <!-- kanan -->
        <div class="bg-[#f2f3fb] flex flex-col w-[750px] h-[875px] justify-center">
          <div class="justify-center ml-[91px]">
              <h1 class="font-bold text-[32px]">Sign Up</h1>
              <p class="text-[14px] pt-[10px] pb-[35px] ">Start turning your into reality.</p>
              <input class="mb-[15px] pl-[20px] border-1 rounded-[25px] border-black/25 w-[568px] h-[75px] placeholder:text-[14px]" type="text" placeholder="Name">
              <input class="mb-[15px] pl-[20px] border-1 rounded-[25px] border-black/25 w-[568px] h-[75px] placeholder:text-[14px]" type="email" placeholder="Email">
              <input class="pl-[20px] border-1 rounded-[25px] border-black/25 w-[568px] h-[75px] placeholder:text-[14px]" type="password" placeholder="Password">
              <div class="mb-[30px] mt-[30px] flex flex-col justify-center items-center">
                <ul>
                  <li>
                    <div class="flex flex-row gap-[23px] pb-[4px]">
                      <div class="w-5 h-5 bg-[#D9D9D9] rounded-full"></div>
                      <p class="text-[14px] text-black/52">Must Be At Least 8 Character</p>
                    </div>
                  </li>
                  <li>
                    <div class="flex flex-row gap-[23px]">
                      <div class="w-5 h-5 bg-[#D9D9D9] rounded-full"></div>
                      <p class="text-[14px] text-black/52">Must Content One Special Character</p>
                    </div>
                  </li>
                </ul>
              </div>
              <button class="mb-[15px] bg-[#0D498E] rounded-[25px] w-[568px] h-[75px] text-[16px] font-bold text-white cursor-pointer+" onclick="location.href='home.html'">Create account</button>
              <button class="border-1 rounded-[25px] border-black/25 w-[568px] h-[75px] justify-center items-center flex">
                <div class="flex flex-row items-center">
                  <iconify-icon icon="material-icon-theme:google" width="36" height="36"></iconify-icon>
                  <p class="pl-[6px] text-[16px] font-bold text-black/52">Sign up with Google</p>
                </div>
                </button>
            </div>
      </div>
      <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  </body>
</html>
